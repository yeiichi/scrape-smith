name: Read the Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Git branch name to build
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: readthedocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-build:
    name: Trigger RTD build
    runs-on: ubuntu-latest
    env:
      RTD_WEBHOOK_URL: https://app.readthedocs.org/api/v2/webhook/scrape-smith/329643/
      RTD_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Trigger Read the Docs build
        run: |
          if [ -z "${RTD_WEBHOOK_SECRET}" ]; then
            echo "::error::Missing repository secret RTD_WEBHOOK_SECRET"
            exit 1
          fi

          payload="$(jq -nc \
            --arg ref "refs/heads/${RTD_VERSION}" \
            --arg default_branch "${{ github.event.repository.default_branch }}" \
            '{ref: $ref, repository: {default_branch: $default_branch}}')"
          signature="$(printf '%s' "${payload}" \
            | openssl dgst -sha256 -hmac "${RTD_WEBHOOK_SECRET}" -binary \
            | xxd -p -c 256)"

          curl --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --header "X-Hub-Signature-256: sha256=${signature}" \
            --data "${payload}" \
            "${RTD_WEBHOOK_URL}"
        env:
          RTD_WEBHOOK_SECRET: ${{ secrets.RTD_WEBHOOK_SECRET }}
