name: Read the Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Read the Docs version slug to build
        required: false
        default: latest

permissions:
  contents: read

concurrency:
  group: readthedocs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-build:
    name: Trigger RTD build
    runs-on: ubuntu-latest
    env:
      RTD_PROJECT: scrape-smith
      RTD_VERSION: ${{ github.event.inputs.version || 'latest' }}
    steps:
      - name: Trigger Read the Docs build
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Authorization: Token ${RTD_TOKEN}" \
            "https://readthedocs.org/api/v3/projects/${RTD_PROJECT}/versions/${RTD_VERSION}/builds/"
        env:
          RTD_TOKEN: ${{ secrets.RTD_TOKEN }}
